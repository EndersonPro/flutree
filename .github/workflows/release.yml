name: release

# Normal release path: goreleaser is chained inside release-please.yml via
# needs: because GITHUB_TOKEN tag pushes from release-please do not trigger
# external tag-based workflows (GitHub Actions recursion guard).
#
# This workflow exists for manual backfill (e.g. v1.1.0 which shipped without
# multi-platform assets) and recovery, mirroring release-brew.yml's fallback
# philosophy. Trigger it manually from the Actions tab, supplying the exact tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # Phase-1 coexistence: release-please's release-brew job still publishes the
    # macos-arm64 asset + Homebrew formula update; this goreleaser job appends the
    # remaining multi-platform assets (linux-amd64, windows-amd64, windows-arm64,
    # etc.) to the same release. The release-brew job will be retired after
    # side-by-side validation (TASK-010/011).
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned to concrete v2 release; update deliberately after vetting changelog.
          version: "v2.16.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_TOKEN is a single PAT used for both brews and scoops publishers
          # (EndersonPro/homebrew-flutree AND EndersonPro/scoop-flutree). The PAT MUST
          # have write access to BOTH repositories.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
