name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: google-github-actions/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # WHY this job lives here and not in release.yml:
  # GitHub Actions never fires a workflow from an event generated with the
  # default GITHUB_TOKEN (recursion guard). release-please pushes the v* tag
  # using GITHUB_TOKEN, so a push:tags trigger in release.yml is silently dead.
  # Chaining via needs: in this same workflow run bypasses that restriction.
  # goreleaser is the sole release publisher: it builds all platform assets
  # (darwin-arm64, linux-amd64, linux-arm64, windows-amd64, windows-arm64)
  # and updates the Homebrew formula and Scoop bucket via its brews/scoops
  # publishers. The former release-brew job was retired (TASK-011) because it
  # uploaded an asset with the same name as goreleaser's darwin-arm64 tarball,
  # causing a 422 already_exists collision that aborted goreleaser before its
  # publishers ran.
  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "v2.16.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
