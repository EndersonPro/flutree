name: tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  version-contract:
    name: version-contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VERSION semver contract
        run: ./scripts/check_version_contract.sh

  windows-build:
    name: windows-build
    runs-on: ubuntu-latest
    # GOOS is set at job level so every step targets windows; GOARCH=amd64 is
    # inlined on the build step only (vet covers all arches goreleaser builds).
    env:
      GOOS: windows

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile for Windows
        run: GOOS=windows GOARCH=amd64 go build ./cmd/flutree
      - name: Vet for Windows
        run: go vet ./...
