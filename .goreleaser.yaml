version: 2

builds:
  - main: ./cmd/flutree
    binary: flutree
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - windows
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: linux
        goarch: arm64

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

brews:
  # tap: EndersonPro/homebrew-flutree
  - repository:
      owner: EndersonPro
      name: homebrew-flutree
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    folder: Formula
    homepage: https://github.com/EndersonPro/flutree
    description: Manage Git worktrees for multi-package Flutter workflows.
    license: MIT
    install: bin.install "flutree"
    test: system "#{bin}/flutree --version"

scoops:
  # bucket: EndersonPro/scoop-flutree
  - repository:
      owner: EndersonPro
      name: scoop-flutree
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    homepage: https://github.com/EndersonPro/flutree
    description: Manage Git worktrees for multi-package Flutter workflows.
    license: MIT
